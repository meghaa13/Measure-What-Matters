<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="ts1 ds1" font-family="Hanken Grotesk, system-ui, sans-serif">
  <title id="ts1">A search ad with a line of text added by Google</title>
  <desc id="ds1">Illustration of a wireframe Search ad. A highlighted block reads "Positive insights from across the web", a phrase from the Google help page. Notes beside it say the text is written by Google's AI from online reviews, cannot be directly edited, and shows only when Google predicts a gain. Four markets are listed: US, UK, Australia, India. Not a screenshot.</desc>
  <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F6FD"/><stop offset="1" stop-color="#EEE9FA"/></linearGradient></defs>
  <rect width="800" height="300" fill="url(#a)"/>
  <text x="40" y="34" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" fill="#5B43B5">WHAT GOOGLE HAS SAID</text>
  <text x="40" y="62" font-family="Newsreader, Georgia, serif" font-size="22" fill="#1E1A2B">A line you did not write, inside your ad.</text>
  <rect x="40" y="84" width="400" height="190" rx="16" fill="#FFFFFF" stroke="#E4DEF2"/>
  <text x="60" y="110" font-family="JetBrains Mono, monospace" font-size="10" fill="#5D5670">Sponsored</text>
  <rect x="128" y="102" width="120" height="8" rx="4" fill="#C5B6F0"/>
  <rect x="60" y="120" width="300" height="12" rx="6" fill="#2E2263"/>
  <rect x="60" y="138" width="200" height="12" rx="6" fill="#2E2263"/>
  <rect x="60" y="160" width="340" height="8" rx="4" fill="#E4DEF2"/>
  <rect x="60" y="174" width="280" height="8" rx="4" fill="#E4DEF2"/>
  <rect x="56" y="196" width="368" height="64" rx="10" fill="#E8E1F8" stroke="#5B43B5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M82 214 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#5B43B5"/>
  <text x="108" y="224" font-size="13" fill="#1E1A2B">"Positive insights from across the web"</text>
  <text x="108" y="244" font-family="JetBrains Mono, monospace" font-size="10" fill="#2E2263">ADDED BY GOOGLE'S AI</text>
  <g>
    <circle cx="482" cy="104" r="5" fill="#5B43B5"/>
    <text x="498" y="109" font-size="14" font-weight="600" fill="#1E1A2B">Written by Google's AI</text>
    <text x="498" y="127" font-size="12" fill="#5D5670">Drawn from online reviews</text>
    <circle cx="482" cy="156" r="5" fill="#5B43B5"/>
    <text x="498" y="161" font-size="14" font-weight="600" fill="#1E1A2B">You cannot edit it</text>
    <text x="498" y="179" font-size="12" fill="#5D5670">Page: cannot directly edit or customize</text>
    <circle cx="482" cy="208" r="5" fill="#5B43B5"/>
    <text x="498" y="213" font-size="14" font-weight="600" fill="#1E1A2B">Shown when Google predicts a gain</text>
    <text x="498" y="231" font-size="12" fill="#5D5670">Search campaigns, in English</text>
  </g>
  <text x="470" y="256" font-family="JetBrains Mono, monospace" font-size="10" fill="#5D5670">MARKETS</text>
  <g font-size="12" font-weight="600" fill="#2E2263">
    <rect x="470" y="262" width="44" height="24" rx="12" fill="#E8E1F8"/><text x="492" y="278" text-anchor="middle">US</text>
    <rect x="522" y="262" width="44" height="24" rx="12" fill="#E8E1F8"/><text x="544" y="278" text-anchor="middle">UK</text>
    <rect x="574" y="262" width="84" height="24" rx="12" fill="#E8E1F8"/><text x="616" y="278" text-anchor="middle">Australia</text>
    <rect x="666" y="262" width="62" height="24" rx="12" fill="#E8E1F8"/><text x="697" y="278" text-anchor="middle">India</text>
  </g>
</svg>
