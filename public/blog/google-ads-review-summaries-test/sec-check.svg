<svg xmlns="http://www.w3.org/2000/svg" width="800" height="296" viewBox="0 0 800 296" role="img" aria-labelledby="ts4 ds4" font-family="Hanken Grotesk, system-ui, sans-serif">
  <title id="ts4">Four-step weekly check of the ads you are shown</title>
  <desc id="ds4">A loop of four steps. One: search your brand and main non-brand terms on desktop and mobile from a clean browser. Two: screenshot every ad that shows review text with date, query and location. Three: check each claim against your real reviews. Four: repeat weekly and share the log. An arrow returns from step four to step one.</desc>
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F6FD"/><stop offset="1" stop-color="#EEE9FA"/></linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9z" fill="#5B43B5"/></marker>
  </defs>
  <rect width="800" height="296" fill="url(#d)"/>
  <text x="40" y="34" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" fill="#5B43B5">HOW TO CHECK WHAT IS SHOWN</text>
  <text x="40" y="62" font-family="Newsreader, Georgia, serif" font-size="22" fill="#1E1A2B">Look at the ad the way a customer does.</text>
  <g fill="#FFFFFF" stroke="#E4DEF2">
    <rect x="40" y="84" width="170" height="140" rx="14"/><rect x="223" y="84" width="170" height="140" rx="14"/>
    <rect x="407" y="84" width="170" height="140" rx="14"/><rect x="590" y="84" width="170" height="140" rx="14"/>
  </g>
  <g fill="#5B43B5"><circle cx="64" cy="108" r="12"/><circle cx="247" cy="108" r="12"/><circle cx="431" cy="108" r="12"/><circle cx="614" cy="108" r="12"/></g>
  <g font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <text x="64" y="112">1</text><text x="247" y="112">2</text><text x="431" y="112">3</text><text x="614" y="112">4</text>
  </g>
  <g font-size="14" font-weight="600" fill="#1E1A2B">
    <text x="84" y="113">Search</text><text x="267" y="113">Capture</text><text x="451" y="113">Compare</text><text x="634" y="113">Repeat</text>
  </g>
  <g font-size="12.5" fill="#2B2540">
    <text x="56" y="145">Brand and main non-</text><text x="56" y="162">brand terms, desktop</text><text x="56" y="179">and mobile, from a</text><text x="56" y="196">clean browser.</text>
    <text x="239" y="145">Screenshot every ad</text><text x="239" y="162">with review text. Note</text><text x="239" y="179">date, query, location.</text>
    <text x="423" y="145">Check each claim with</text><text x="423" y="162">your real reviews. Note</text><text x="423" y="179">wrong, outdated or</text><text x="423" y="196">off-brand wording.</text>
    <text x="606" y="145">Weekly. Add shots to a</text><text x="606" y="162">shared log. Ask sales</text><text x="606" y="179">and support to flag</text><text x="606" y="196">anything odd.</text>
  </g>
  <path d="M675 224 V252 H125 V228" fill="none" stroke="#5B43B5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="400" y="277" text-anchor="middle" font-size="13" fill="#1E1A2B">Results are personalised, so one missing summary proves nothing. That is why you repeat.</text>
</svg>
