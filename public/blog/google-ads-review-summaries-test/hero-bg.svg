<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" preserveAspectRatio="xMaxYMid slice" font-family="Hanken Grotesk, system-ui, sans-serif">
  <title>Abstract picture of a search ad with an extra line of text added by Google</title>
  <desc>Decorative hero background. A wireframe search ad card with a highlighted line marked as added by Google, on a purple gradient with a dot grid. No data is plotted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2A82"/><stop offset=".55" stop-color="#2E2263"/><stop offset="1" stop-color="#1E1A2B"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8E74DD" stop-opacity=".6"/><stop offset="1" stop-color="#8E74DD" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5B43B5" stop-opacity=".55"/><stop offset="1" stop-color="#5B43B5" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#C5B6F0" fill-opacity=".16"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#0E0A24" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <circle cx="1230" cy="330" r="560" fill="url(#g1)"/>
  <circle cx="160" cy="720" r="480" fill="url(#g2)"/>
  <rect width="1600" height="760" fill="url(#dots)"/>
  <!-- faint line motif along the bottom: shape only, no values -->
  <polyline points="0,690 160,664 300,676 460,632 620,648 780,600 940,620 1100,566 1260,590 1420,540 1600,556" fill="none" stroke="#C5B6F0" stroke-opacity=".22" stroke-width="2"/>
  <polyline points="0,730 200,716 380,722 560,690 760,700 960,664 1160,676 1360,630 1600,640" fill="none" stroke="#C5B6F0" stroke-opacity=".12" stroke-width="2"/>
  <g fill="none" stroke="#C5B6F0" stroke-opacity=".28" stroke-dasharray="6 10">
    <circle cx="1230" cy="360" r="300"/><circle cx="1230" cy="360" r="420"/>
  </g>

  <g transform="rotate(-3 1230 370)" filter="url(#sh)">
    <rect x="1000" y="170" width="450" height="380" rx="22" fill="#FFFFFF"/>
    <text x="1030" y="212" font-family="JetBrains Mono, monospace" font-size="13" fill="#5D5670">Sponsored</text>
    <rect x="1118" y="202" width="150" height="9" rx="4.5" fill="#C5B6F0"/>
    <rect x="1030" y="238" width="360" height="17" rx="8.5" fill="#2E2263"/>
    <rect x="1030" y="266" width="240" height="17" rx="8.5" fill="#2E2263"/>
    <rect x="1030" y="304" width="390" height="10" rx="5" fill="#E4DEF2"/>
    <rect x="1030" y="324" width="330" height="10" rx="5" fill="#E4DEF2"/>
    <rect x="1022" y="360" width="406" height="150" rx="14" fill="#F3F0FB" stroke="#5B43B5" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M1060 392 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7z" fill="#5B43B5"/>
    <text x="1104" y="408" font-size="19" fill="#1E1A2B">Positive insights from</text>
    <text x="1104" y="432" font-size="19" fill="#1E1A2B">across the web</text>
    <rect x="1104" y="452" width="250" height="9" rx="4.5" fill="#B3A1EC"/>
    <rect x="1104" y="472" width="190" height="9" rx="4.5" fill="#B3A1EC"/>
    <rect x="1250" y="132" width="196" height="40" rx="20" fill="#5B43B5"/>
    <text x="1348" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Added by Google</text>
  </g>

</svg>
