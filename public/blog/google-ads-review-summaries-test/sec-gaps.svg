<svg xmlns="http://www.w3.org/2000/svg" width="800" height="312" viewBox="0 0 800 312" role="img" aria-labelledby="ts2 ds2" font-family="Hanken Grotesk, system-ui, sans-serif">
  <title id="ts2">Eight things the review summaries help page does not say</title>
  <desc id="ds2">A checklist of gaps in Google's help page: no on or off setting, whether account-level automated asset controls cover the feature, reporting information, review sources, how many reviews are needed, what happens when reviews are mostly negative, whether the ad labels the text as AI-written, and which metric performance means. Source: Google Ads Help and PPC Land.</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F6FD"/><stop offset="1" stop-color="#EEE9FA"/></linearGradient></defs>
  <rect width="800" height="312" fill="url(#b)"/>
  <text x="40" y="34" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" fill="#5B43B5">WHAT GOOGLE HAS NOT SAID</text>
  <text x="40" y="62" font-family="Newsreader, Georgia, serif" font-size="22" fill="#1E1A2B">Eight things the help page leaves out.</text>
  <g font-size="14" fill="#1E1A2B">
    <g transform="translate(40 88)">
      <rect width="350" height="44" rx="12" fill="#FFFFFF" stroke="#E4DEF2"/><circle cx="24" cy="22" r="10" fill="#FBE9EC"/><path d="M19 22h10" stroke="#B42335" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="27">An on/off setting</text>
    </g>
    <g transform="translate(40 142)">
      <rect width="350" height="44" rx="12" fill="#FFFFFF" stroke="#E4DEF2"/><circle cx="24" cy="22" r="10" fill="#FBE9EC"/><path d="M19 22h10" stroke="#B42335" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="27">Any reporting information</text>
    </g>
    <g transform="translate(40 196)">
      <rect width="350" height="44" rx="12" fill="#FFFFFF" stroke="#E4DEF2"/><circle cx="24" cy="22" r="10" fill="#FBE9EC"/><path d="M19 22h10" stroke="#B42335" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="27">Which review sources are used</text>
    </g>
    <g transform="translate(40 250)">
      <rect width="350" height="44" rx="12" fill="#FFFFFF" stroke="#E4DEF2"/><circle cx="24" cy="22" r="10" fill="#FBE9EC"/><path d="M19 22h10" stroke="#B42335" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="27">How many reviews are needed</text>
    </g>
    <g transform="translate(410 88)">
      <rect width="350" height="44" rx="12" fill="#FFFFFF" stroke="#E4DEF2"/><circle cx="24" cy="22" r="10" fill="#FBE9EC"/><path d="M19 22h10" stroke="#B42335" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="27">If account-level controls cover it</text>
    </g>
    <g transform="translate(410 142)">
      <rect width="350" height="44" rx="12" fill="#FFFFFF" stroke="#E4DEF2"/><circle cx="24" cy="22" r="10" fill="#FBE9EC"/><path d="M19 22h10" stroke="#B42335" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="27">What happens if reviews are negative</text>
    </g>
    <g transform="translate(410 196)">
      <rect width="350" height="44" rx="12" fill="#FFFFFF" stroke="#E4DEF2"/><circle cx="24" cy="22" r="10" fill="#FBE9EC"/><path d="M19 22h10" stroke="#B42335" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="27">Whether the ad labels it AI-written</text>
    </g>
    <g transform="translate(410 250)">
      <rect width="350" height="44" rx="12" fill="#FFFFFF" stroke="#E4DEF2"/><circle cx="24" cy="22" r="10" fill="#FBE9EC"/><path d="M19 22h10" stroke="#B42335" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="27">Which metric "performance" means</text>
    </g>
  </g>
