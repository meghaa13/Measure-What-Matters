<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t3 d3" font-family="Hanken Grotesk, system-ui, sans-serif">
  <title id="t3">Google writes review claims into your ads. Test them.</title>
  <desc id="d3">Share card for the article by Megha Karnwal on Google's AI review summaries in Search ads. Shows the headline and the line: 4 markets, 5 sources, checked 30 October 2026.</desc>
  <rect width="1200" height="630" fill="#F3F0FB"/>
  <circle cx="1040" cy="120" r="260" fill="none" stroke="#B3A1EC" stroke-dasharray="6 8"/>
  <rect x="64" y="64" width="64" height="64" rx="22" fill="#5B43B5"/>
  <text x="96" y="112" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="40" fill="#FFFFFF">m</text>
  <text x="150" y="104" font-family="JetBrains Mono, monospace" font-size="20" letter-spacing="2" fill="#5B43B5">ADS &#183; MEASUREMENT</text>
  <text x="64" y="270" font-family="Newsreader, Georgia, serif" font-size="84" fill="#1E1A2B">Google writes review</text>
  <text x="64" y="364" font-family="Newsreader, Georgia, serif" font-size="84" fill="#1E1A2B">claims into your ads.</text>
  <text x="64" y="458" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="84" fill="#5B43B5">Test them.</text>
  <line x1="64" y1="520" x2="1136" y2="520" stroke="#C5B6F0"/>
  <text x="64" y="568" font-family="JetBrains Mono, monospace" font-size="22" fill="#5D5670">4 markets  &#183;  5 sources  &#183;  checked 30 Oct 2026</text>
  <text x="1136" y="568" text-anchor="end" font-size="24" font-weight="600" fill="#2E2263">Megha Karnwal</text>
</svg>
