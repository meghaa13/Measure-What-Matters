<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">What to do with this, in four moves</title>
  <desc id="d">Diagram, no data plotted. Run the test this week and re-run it in a quarter. Use Search Console clicks as the cleanest count of Google search traffic. Judge AI Mode ads on your own conversions and cost per acquisition against a matched period of ordinary search. Put a dated note in your reporting saying how you treat AI Mode traffic.</desc>
  <rect width="800" height="300" fill="#FBFAFD"/>
<text x="40" y="34" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5B43B5" letter-spacing="1">WHAT TO DO</text>
<text x="40" y="62" font-family="Newsreader, Georgia, serif" font-size="22" fill="#1E1A2B">Four moves, none of them waiting for Google.</text>
<rect x="40" y="84" width="170" height="150" rx="14" fill="#2E2263"/>
<text x="56" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#C5B6F0">THIS WEEK</text>
<text x="56" y="136" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" fill="#fff" font-weight="600">Run the test</text>
<text x="56" y="160" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#E8E1F8">Re-run it in a quarter.</text>
<text x="56" y="178" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#E8E1F8">Keep the notes.</text>
<rect x="222" y="84" width="170" height="150" rx="14" fill="#fff" stroke="#E4DEF2"/>
<text x="238" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5B43B5">REPORTING</text>
<text x="238" y="136" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" fill="#1E1A2B" font-weight="600">Count with GSC</text>
<text x="238" y="160" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">Cleanest count of</text>
<text x="238" y="178" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">Google search traffic.</text>
<text x="238" y="196" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">Includes AI Mode,</text>
<text x="238" y="214" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">cannot split it.</text>
<rect x="404" y="84" width="170" height="150" rx="14" fill="#fff" stroke="#E4DEF2"/>
<text x="420" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5B43B5">IF YOU BUY ADS</text>
<text x="420" y="136" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" fill="#1E1A2B" font-weight="600">Use your numbers</text>
<text x="420" y="160" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">Your conversions and</text>
<text x="420" y="178" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">CPA vs a matched</text>
<text x="420" y="196" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">period of ordinary</text>
<text x="420" y="214" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">search.</text>
<rect x="586" y="84" width="174" height="150" rx="14" fill="#fff" stroke="#E4DEF2"/>
<text x="602" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5B43B5">DOCUMENT IT</text>
<text x="602" y="136" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" fill="#1E1A2B" font-weight="600">Add a dated note</text>
<text x="602" y="160" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">Say how you treat AI</text>
<text x="602" y="178" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">Mode traffic, so next</text>
<text x="602" y="196" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">year's reader knows.</text>
<text x="40" y="272" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#5D5670">Figure 5. The article's closing actions. No data plotted.</text>
</svg>
