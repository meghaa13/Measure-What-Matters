<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">Alphabet Google Search and other revenue, Q3 2025 and Q3 2026</title>
  <desc id="d">Bar chart on a zero-based axis, US dollars million. Q3 2025: 56,567. Q3 2026: 63,350. Growth is about 12 percent, the writer's own arithmetic. The release does not mention AI Mode, so this chart says nothing about AI Mode.</desc>
  <rect width="800" height="400" fill="#FBFAFD"/>
