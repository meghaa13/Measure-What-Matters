<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-labelledby="t d">
  <title id="t">What each tool shows for an AI Mode click</title>
  <desc id="d">Diagram, no data plotted. An AI Mode click reaches your site. Per Google's documentation, Search Console counts it as a click but does not split it out. How GA4 labels it is not documented, so you test it on your own property.</desc>
  <g font-family="Hanken Grotesk, system-ui, sans-serif">
    <rect x="0" y="20" width="250" height="88" rx="16" fill="#2E2263" stroke="#C5B6F0" stroke-opacity=".6"/>
    <text x="20" y="50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#C5B6F0" letter-spacing="1">AN AI MODE CLICK</text>
    <text x="20" y="78" font-size="18" fill="#fff" font-weight="600">Reaches your site</text>
    <path d="M125 108v52m-7-8l7 8 7-8" stroke="#C5B6F0" stroke-width="2" fill="none"/>
    <rect x="0" y="168" width="250" height="100" rx="16" fill="#fff"/>
    <text x="20" y="198" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#5B43B5" letter-spacing="1">SEARCH CONSOLE</text>
    <text x="20" y="226" font-size="18" fill="#1E1A2B" font-weight="600">Counted as a click</text>
    <text x="20" y="250" font-size="15" fill="#2B2540">Not split out</text>
    <path d="M250 218h50m-8-7l8 7-8 7" stroke="#C5B6F0" stroke-width="2" fill="none"/>
    <rect x="310" y="168" width="250" height="100" rx="16" fill="none" stroke="#C5B6F0" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="330" y="198" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#C5B6F0" letter-spacing="1">GA4</text>
    <text x="330" y="226" font-size="18" fill="#fff" font-weight="600">Label: not documented</text>
    <text x="330" y="250" font-size="15" fill="#EEE9FA">Test it on your property</text>
    <text x="0" y="316" font-size="13" fill="#EEE9FA">Per Google's Search Console and Search Central pages.</text>
    <text x="0" y="338" font-size="13" fill="#C5B6F0">Illustration, no data plotted.</text>
  </g>
</svg>
