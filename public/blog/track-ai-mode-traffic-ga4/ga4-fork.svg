<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="t d">
  <title id="t">Where an AI Mode visit might land in GA4: unresolved</title>
  <desc id="d">Diagram, no data plotted. Google documentation says nothing about how GA4 labels AI Mode visits. Two outcomes are possible and neither is confirmed: the visit sits inside Direct, so the Direct line grows for no visible reason, or it sits inside google / organic, so organic mixes two kinds of visit. The test in the next section settles it for your own property.</desc>
  <rect width="800" height="340" fill="#FBFAFD"/>
<text x="40" y="34" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5B43B5" letter-spacing="1">WHAT GA4 DOES: UNRESOLVED</text>
<text x="40" y="62" font-family="Newsreader, Georgia, serif" font-size="22" fill="#1E1A2B">Two possible outcomes. Neither is confirmed.</text>
<rect x="40" y="110" width="190" height="100" rx="14" fill="#2E2263"/>
<text x="56" y="136" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#C5B6F0">AN AI MODE VISIT</text>
<text x="56" y="162" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" fill="#fff" font-weight="600">Reaches your site</text>
<text x="56" y="186" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#E8E1F8">Label: not documented</text>
<path d="M234 140l66-44m-9 0l9 0-2 9M234 180l66 44m-8-1l8 1-2-9" stroke="#5B43B5" stroke-width="2" fill="none"/>
<rect x="310" y="76" width="450" height="84" rx="14" fill="#fff" stroke="#E4DEF2"/>
<text x="326" y="102" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5B43B5">POSSIBLE A</text>
<text x="326" y="128" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" fill="#1E1A2B" font-weight="600">Inside Direct</text>
<text x="326" y="146" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">Your Direct line grows for no reason you can see.</text>
<rect x="310" y="176" width="450" height="84" rx="14" fill="#fff" stroke="#E4DEF2"/>
<text x="326" y="202" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5B43B5">POSSIBLE B</text>
<text x="326" y="228" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" fill="#1E1A2B" font-weight="600">Inside google / organic</text>
<text x="326" y="246" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#2B2540">Your organic line mixes two kinds of visit.</text>
<text x="40" y="294" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" fill="#5D5670">Figure 3. The answer may differ by browser, app and date. Illustration, no data plotted.</text>
<text x="40" y="314" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5D5670">Source: Google Search Central, AI features, updated 10 Dec 2025 (no mention of referrers).</text>
</svg>
