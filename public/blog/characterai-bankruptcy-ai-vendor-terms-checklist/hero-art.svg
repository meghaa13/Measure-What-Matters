<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
  <title id="t">A chat window with its messages blanked out and a paper tag reading Proposed sale</title>
  <desc id="d">A dark chat window. The messages are drawn as blank grey bars, so no conversation is shown. A paper tag hangs from the window's corner on a string and reads Proposed sale, Chat content, Nothing sold yet. Illustration, not data.</desc>
  <ellipse cx="270" cy="486" rx="200" ry="14" fill="#2E2263" opacity=".10"/>
  <g>
    <rect x="30" y="40" width="400" height="430" rx="26" fill="#1E1A2B"/>
    <rect x="30" y="40" width="400" height="58" rx="26" fill="#2B2540"/>
    <rect x="30" y="72" width="400" height="26" fill="#2B2540"/>
    <circle cx="62" cy="69" r="8" fill="#9A93AE"/>
    <rect x="82" y="62" width="120" height="14" rx="7" fill="#5D5670"/>
    <!-- incoming messages: blanked -->
    <rect x="54" y="124" width="250" height="64" rx="18" fill="#2B2540"/>
    <rect x="72" y="142" width="190" height="10" rx="5" fill="#5D5670"/>
    <rect x="72" y="162" width="130" height="10" rx="5" fill="#5D5670"/>
    <!-- outgoing -->
    <rect x="150" y="208" width="256" height="64" rx="18" fill="#5B43B5"/>
    <rect x="170" y="226" width="200" height="10" rx="5" fill="#C5B6F0"/>
    <rect x="170" y="246" width="140" height="10" rx="5" fill="#C5B6F0"/>
    <rect x="54" y="292" width="210" height="40" rx="18" fill="#2B2540"/>
    <rect x="72" y="307" width="150" height="10" rx="5" fill="#5D5670"/>
    <rect x="150" y="352" width="256" height="40" rx="18" fill="#5B43B5"/>
    <rect x="170" y="367" width="170" height="10" rx="5" fill="#C5B6F0"/>
    <!-- input -->
    <rect x="54" y="414" width="352" height="36" rx="18" fill="#2B2540"/>
    <rect x="74" y="428" width="90" height="8" rx="4" fill="#5D5670"/>
  </g>
  <!-- string and tag -->
  <path d="M418 70 C 470 70, 480 110, 462 150" fill="none" stroke="#5D5670" stroke-width="3" stroke-linecap="round"/>
  <circle cx="418" cy="70" r="7" fill="#9A93AE"/>
  <g transform="rotate(8 462 250)">
    <path d="M462 146 L 520 176 L 520 372 Q 520 384 508 384 L 416 384 Q 404 384 404 372 L 404 176 Z" fill="#FFFFFF" stroke="#B42335" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="462" cy="176" r="8" fill="#F3F0FB" stroke="#B42335" stroke-width="3"/>
    <text x="462" y="226" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" letter-spacing="1.5" fill="#B42335">PROPOSED</text>
    <text x="462" y="246" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" letter-spacing="1.5" fill="#B42335">SALE</text>
    <line x1="424" y1="266" x2="500" y2="266" stroke="#E4DEF2" stroke-width="2"/>
    <text x="462" y="298" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="17" fill="#1E1A2B">Chat content</text>
    <text x="462" y="334" text-anchor="middle" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" fill="#5D5670">Nothing sold</text>
    <text x="462" y="354" text-anchor="middle" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" fill="#5D5670">yet</text>
  </g>
</svg>
