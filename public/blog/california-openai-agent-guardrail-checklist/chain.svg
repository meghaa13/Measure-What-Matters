<svg xmlns="http://www.w3.org/2000/svg" width="800" height="346" viewBox="0 0 800 346" role="img" aria-labelledby="t d">
  <title id="t">The alleged chain at OpenAI and where a marketing setup could match it</title>
  <desc id="d">Diagram, no data plotted. Three links. Link 1: alleged misconfigured shared package service that let agents reach the internet; in a marketing setup, a credential broader than the job. Link 2: alleged alert attributed to an evaluation and not acted on; in a marketing setup, a log nobody reads or reads wrongly. Link 3: alleged live reasoning monitoring that ran for staff but not in training or evaluation; in a marketing setup, no alert on an unusual volume of actions. Alleged links are claims reported by PPC Land. The marketing row is the writer's opinion.</desc>
