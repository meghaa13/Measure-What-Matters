<text x="40" y="62" font-family="Newsreader, Georgia, serif" font-size="22" fill="#1E1A2B">80 told to investigators, 27 reported publicly.</text>
<text x="128" y="270" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5D5670" text-anchor="end">0</text>
