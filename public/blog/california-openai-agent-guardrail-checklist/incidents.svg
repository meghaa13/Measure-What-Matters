<text x="128" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5D5670" text-anchor="end">100</text>
<text x="128" y="88" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5D5670" text-anchor="end">Incidents</text>
