<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img" aria-labelledby="t d">
  <title id="t">Loss-of-control incidents: told to the California AG versus reported publicly</title>
  <desc id="d">Bar chart on a zero-based axis, number of incidents, alleged and unproven. Told to the California Attorney General's investigators: 80, per CNBC; PPC Land says more than 80. Reported publicly by OpenAI: 27, per PPC Land only. The gap may be a dispute over what counts as an incident.</desc>
  <rect width="800" height="310" fill="#FBFAFD"/>
