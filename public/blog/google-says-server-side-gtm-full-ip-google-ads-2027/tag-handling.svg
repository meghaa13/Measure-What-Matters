<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t2 d2">
<title id="t2">How IP handling reportedly changes on 11 January 2027</title>
<desc id="d2">Today the server container redacts IP addresses for the whole container. From 11 January 2027, each tag decides. Google Ads, Display and Video 360, Search Ads 360 and Campaign Manager 360 tags will accept the full IP address. Google Analytics tags keep redacting. Third-party tags keep independent control. Per an email Google reportedly sent, as quoted by PPC Land. No data plotted.</desc>
<rect width="800" height="400" fill="#FBFAFD"/>
<g font-family="Arial,sans-serif">
<text x="40" y="38" font-family="Georgia,serif" font-size="22" fill="#1E1A2B">Redaction moves from the container to each tag</text>
<rect x="40" y="62" width="720" height="62" rx="14" fill="#F3F0FB" stroke="#E4DEF2"/>
<text x="60" y="88" font-size="14" font-weight="700" letter-spacing="1" fill="#5B43B5">TODAY</text>
<text x="60" y="110" font-size="16" fill="#1E1A2B">The server container redacts the IP for every tag, as one setting.</text>
<text x="400" y="150" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#5B43B5">FROM 11 JAN 2027 (REPORTED): EACH TAG DECIDES</text>
<rect x="40" y="170" width="226" height="166" rx="14" fill="#fff" stroke="#B42335" stroke-width="2"/>
<rect x="40" y="170" width="226" height="34" rx="14" fill="#B42335"/><rect x="40" y="190" width="226" height="14" fill="#B42335"/>
<text x="56" y="193" font-size="14" font-weight="700" fill="#fff">Accepts full IP</text>
<text x="56" y="228" font-size="15" font-weight="700" fill="#1E1A2B">Google Ads</text>
<text x="56" y="250" font-size="15" font-weight="700" fill="#1E1A2B">DV360</text>
<text x="56" y="272" font-size="15" font-weight="700" fill="#1E1A2B">SA360</text>
<text x="56" y="294" font-size="15" font-weight="700" fill="#1E1A2B">CM360</text>
<text x="56" y="322" font-size="14" fill="#5D5670">Opt-out reportedly offered</text>
<rect x="287" y="170" width="226" height="166" rx="14" fill="#fff" stroke="#1F7A55" stroke-width="2"/>
<rect x="287" y="170" width="226" height="34" rx="14" fill="#1F7A55"/><rect x="287" y="190" width="226" height="14" fill="#1F7A55"/>
<text x="303" y="193" font-size="14" font-weight="700" fill="#fff">Keeps redacting</text>
<text x="303" y="228" font-size="15" font-weight="700" fill="#1E1A2B">Google Analytics</text>
<text x="303" y="252" font-size="14" fill="#5D5670">"will continue to apply</text>
<text x="303" y="270" font-size="14" fill="#5D5670">IP redaction"</text>
<rect x="534" y="170" width="226" height="166" rx="14" fill="#fff" stroke="#5B43B5" stroke-width="2"/>
<rect x="534" y="170" width="226" height="34" rx="14" fill="#5B43B5"/><rect x="534" y="190" width="226" height="14" fill="#5B43B5"/>
<text x="550" y="193" font-size="14" font-weight="700" fill="#fff">Own control</text>
<text x="550" y="228" font-size="15" font-weight="700" fill="#1E1A2B">Third-party tags</text>
<text x="550" y="252" font-size="14" fill="#5D5670">Each keeps "independent</text>
<text x="550" y="270" font-size="14" fill="#5D5670">control" of what it accepts.</text>
<text x="550" y="298" font-size="14" fill="#5D5670">Meta, TikTok, LinkedIn are</text>
<text x="550" y="316" font-size="14" fill="#5D5670">PPC Land's examples.</text>
</g>
</svg>
