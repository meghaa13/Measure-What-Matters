<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 428" width="800" height="428" role="img" aria-labelledby="t5 d5">
<title id="t5">The seven-step checklist as a flow</title>
<desc id="d5">Step 1: do you have a server container? If not, stop. If yes, list the tags (Google Ads, DV360, SA360, CM360 are in scope), split traffic by country, record ratio baselines, then decide to accept or redact. Redact leads to a one-hour transformation test in preview mode. Accept skips to asking your vendor and watching the release notes weekly. Method diagram, no data plotted. Step 5 is the author's opinion, not legal advice.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B43B5"/></marker></defs>
<rect width="800" height="428" fill="#FBFAFD"/>
<g font-family="Arial,sans-serif">
<text x="20" y="32" font-family="Georgia,serif" font-size="22" fill="#1E1A2B">The checklist at a glance</text>
<text x="20" y="54" font-size="14" fill="#5D5670">Numbers match the list below. Step 5 is my view, not legal advice.</text>
<rect x="20" y="70" width="172" height="124" rx="14" fill="#F3F0FB" stroke="#5B43B5" stroke-width="2"/><circle cx="46" cy="96" r="14" fill="#5B43B5"/><text x="46" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text><text x="36" y="136" font-size="17" fill="#1E1A2B">Server container?</text><text x="36" y="156" font-size="14" fill="#5D5670">Tags fired from</text><text x="36" y="174" font-size="14" fill="#5D5670">your own server.</text><rect x="216" y="70" width="172" height="124" rx="14" fill="#fff" stroke="#E4DEF2" stroke-width="1.5"/><circle cx="242" cy="96" r="14" fill="#5B43B5"/><text x="242" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text><text x="232" y="136" font-size="17" fill="#1E1A2B">List the tags</text><text x="232" y="156" font-size="14" fill="#5D5670">Ads, DV360, SA360,</text><text x="232" y="174" font-size="14" fill="#5D5670">CM360 are in scope.</text><rect x="412" y="70" width="172" height="124" rx="14" fill="#fff" stroke="#E4DEF2" stroke-width="1.5"/><circle cx="438" cy="96" r="14" fill="#5B43B5"/><text x="438" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text><text x="428" y="136" font-size="17" fill="#1E1A2B">Split by country</text><text x="428" y="156" font-size="14" fill="#5D5670">Last 30 days. EEA,</text><text x="428" y="174" font-size="14" fill="#5D5670">UK, Switzerland.</text><rect x="608" y="70" width="172" height="124" rx="14" fill="#fff" stroke="#E4DEF2" stroke-width="1.5"/><circle cx="634" cy="96" r="14" fill="#5B43B5"/><text x="634" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text><text x="624" y="136" font-size="17" fill="#1E1A2B">Baseline ratios</text><text x="624" y="156" font-size="14" fill="#5D5670">Ads conversions per</text><text x="624" y="174" font-size="14" fill="#5D5670">backend order.</text><rect x="608" y="264" width="172" height="124" rx="14" fill="#F3F0FB" stroke="#5B43B5" stroke-width="2"/><circle cx="634" cy="290" r="14" fill="#5B43B5"/><text x="634" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text><text x="624" y="330" font-size="17" fill="#1E1A2B">Accept or redact?</text><text x="624" y="350" font-size="14" fill="#5D5670">Redact: go to 6.</text><text x="624" y="368" font-size="14" fill="#5D5670">Accept: go to 7.</text><rect x="412" y="264" width="172" height="124" rx="14" fill="#fff" stroke="#E4DEF2" stroke-width="1.5"/><circle cx="438" cy="290" r="14" fill="#5B43B5"/><text x="438" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">6</text><text x="428" y="330" font-size="17" fill="#1E1A2B">Try a transformation</text><text x="428" y="350" font-size="14" fill="#5D5670">1 hour, preview mode.</text><text x="428" y="368" font-size="14" fill="#5D5670">IP gone? Keep it.</text><text x="428" y="386" font-size="14" fill="#5D5670">If not, stop.</text><rect x="216" y="264" width="172" height="124" rx="14" fill="#fff" stroke="#E4DEF2" stroke-width="1.5"/><circle cx="242" cy="290" r="14" fill="#5B43B5"/><text x="242" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">7</text><text x="232" y="330" font-size="17" fill="#1E1A2B">Ask your vendor</text><text x="232" y="350" font-size="14" fill="#5D5670">In writing. Then check</text><text x="232" y="368" font-size="14" fill="#5D5670">release notes weekly.</text><rect x="20" y="264" width="172" height="124" rx="14" fill="#fff" stroke="#9A93AD" stroke-width="1.5" stroke-dasharray="6 5"/><text x="36" y="330" font-size="17" fill="#1E1A2B">Stop</text><text x="36" y="350" font-size="14" fill="#5D5670">Not about you.</text><path d="M194 132 H213" fill="none" stroke="#5B43B5" stroke-width="2" marker-end="url(#a)"/><path d="M390 132 H409" fill="none" stroke="#5B43B5" stroke-width="2" marker-end="url(#a)"/><path d="M586 132 H605" fill="none" stroke="#5B43B5" stroke-width="2" marker-end="url(#a)"/><path d="M694 196 V261" fill="none" stroke="#5B43B5" stroke-width="2" marker-end="url(#a)"/><path d="M606 326 H587" fill="none" stroke="#5B43B5" stroke-width="2" marker-end="url(#a)"/><path d="M410 326 H391" fill="none" stroke="#5B43B5" stroke-width="2" marker-end="url(#a)"/><path d="M106 196 V261" fill="none" stroke="#5B43B5" stroke-width="2" marker-end="url(#a)"/><text x="116" y="234" font-size="14" fill="#5B43B5">No</text><text x="204" y="124" text-anchor="middle" font-size="13" fill="#5B43B5">Yes</text><path d="M724 388 V410 H302 V391" fill="none" stroke="#5B43B5" stroke-width="2" marker-end="url(#a)"/><text x="498" y="404" text-anchor="middle" font-size="14" fill="#5B43B5">Accept</text>
</g></svg>