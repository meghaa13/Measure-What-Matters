<svg xmlns="http://www.w3.org/2000/svg" width="390" height="640" viewBox="0 0 390 640" role="img" aria-labelledby="t d">
  <title id="t">Decorative hero background for phones</title>
  <desc id="d">A level balance with two pans, a price tag on each, drawn in light purple lines on dark purple, sized to fit a phone screen behind the title. Decorative only. It shows no data and makes no claim about which side is heavier.</desc>
