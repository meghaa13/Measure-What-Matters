    <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#C5B6F0" fill-opacity=".3"/></pattern>
    <radialGradient id="r" cx="50%" cy="30%" r="60%"><stop offset="0" stop-color="#8E74DD" stop-opacity=".5"/><stop offset="1" stop-color="#2E2263" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="390" height="640" fill="#2E2263"/>
  <rect width="390" height="640" fill="url(#g)"/>
  <rect width="390" height="640" fill="url(#r)"/>
  <g fill="none" stroke="#C5B6F0" stroke-opacity=".7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
