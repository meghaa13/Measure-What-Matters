<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
  <title id="t">A phone with one permission switched on, and the gap between allowed and agreed</title>
  <desc id="d">Illustration, not data. A phone screen shows a single switch labelled Allow, turned on. A line leads to a solid pill reading Allowed. Below it a dashed gap leads to a dashed pill reading Agreed with a question mark, labelled its own consent.</desc>
  <circle cx="300" cy="270" r="230" fill="#E8E1F8" fill-opacity=".55"/>
  <circle cx="300" cy="270" r="170" fill="none" stroke="#C5B6F0" stroke-width="2" stroke-dasharray="4 10"/>
  <rect x="50" y="36" width="236" height="448" rx="42" fill="#2E2263"/>
  <rect x="64" y="50" width="208" height="420" rx="31" fill="#fff"/>
  <rect x="127" y="62" width="82" height="12" rx="6" fill="#2E2263"/>
  <text x="88" y="140" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17" fill="#5D5670" letter-spacing="1.5">PHOTOS</text>
  <rect x="80" y="158" width="176" height="64" rx="16" fill="#F3F0FB"/>
  <text x="98" y="199" font-family="Newsreader, Georgia, serif" font-size="30" fill="#1E1A2B">Allow</text>
  <rect x="186" y="174" width="56" height="32" rx="16" fill="#1F7A55"/>
  <circle cx="226" cy="190" r="12" fill="#fff"/>
  <rect x="80" y="252" width="150" height="10" rx="5" fill="#E8E1F8"/>
  <rect x="80" y="276" width="176" height="10" rx="5" fill="#E8E1F8"/>
  <rect x="80" y="300" width="120" height="10" rx="5" fill="#E8E1F8"/>
  <rect x="80" y="352" width="176" height="64" rx="16" fill="#fff" stroke="#E4DEF2" stroke-width="2"/>
  <rect x="98" y="378" width="96" height="10" rx="5" fill="#E4DEF2"/>
  <rect x="204" y="372" width="36" height="22" rx="11" fill="#E4DEF2"/>
  <circle cx="215" cy="383" r="8" fill="#fff"/>
  <path d="M256 190 H 350" stroke="#5B43B5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="350" cy="190" r="6" fill="#5B43B5"/>
  <rect x="360" y="158" width="168" height="64" rx="32" fill="#5B43B5"/>
  <text x="444" y="199" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="30" fill="#fff">Allowed</text>
  <path d="M444 236 V 326" stroke="#8E74DD" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M424 244 L444 228 L464 244 M424 318 L444 334 L464 318" fill="none" stroke="#8E74DD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="474" y="288" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="24" fill="#5D5670">the gap</text>
  <rect x="360" y="342" width="168" height="64" rx="32" fill="#fff" stroke="#B42335" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="444" y="383" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="30" fill="#B42335">Agreed?</text>
  <text x="444" y="438" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17" fill="#5D5670" letter-spacing="1">ITS OWN CONSENT</text>
</svg>
