<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Forms</title></head>
<body>
<!-- Netlify Forms detects forms at deploy time from static HTML. The Tag Health Scan
     posts to this file; submissions appear under Netlify → Forms → tag-scan-report. -->
<form name="tag-scan-report" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="tag-scan-report">
  <input name="bot-field">
  <input type="email" name="email">
  <input name="site">
  <input name="score">
  <input name="findings">
</form>
<form name="lead-path-bulk" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="lead-path-bulk"><input name="bot-field"><input type="email" name="email">
</form>
<form name="lead-path-monitoring" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="lead-path-monitoring"><input name="bot-field"><input type="email" name="email"><input name="site">
</form>
<form name="share-of-model" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="share-of-model"><input name="bot-field"><input type="email" name="email"><input name="site">
</form>
<form name="ai-citations" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="ai-citations"><input name="bot-field"><input type="email" name="email"><input name="site">
</form>
</body>
</html>
