# Dependabot opens a pull request when a dependency has an update or a security fix.
# Pull requests target the stage branch, so every update is tested there before main.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "stage"
    schedule:
      interval: "monthly"
    # One pull request a month for everything, so Netlify builds one preview, not several.
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns: ["*"]
